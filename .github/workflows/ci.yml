# CI for the GB Go port: Phase 0 gates (migration plan section 21, PR-B).
#
# Phase 0/1 gates, unchanged in substance: build, gofmt, go vet, go mod
# verify/tidy, go test, go test -race, golden fixture reproducibility, golden
# mutation self-checks, inventory reconciliation against the tests that
# actually executed, govulncheck, lint baseline (tools/lintdiff), the
# acknowledgment gate (labels known-defect-added / gate-change-reviewed,
# applied to the pull request by the repository's sole maintainer; label
# add/remove re-runs the workflow; pushes to master run technical validation
# only; commit messages are never an acknowledgment).
#
# Phase 2C (2026-10-30), first step: runtime modernisation only; the jobs
# and their checks are unchanged in substance.
#
# Runtime: ubuntu-26.04 (ubuntu-latest is migrating to it), actions pinned to
# commit SHAs of Node 24 releases (Node 20 removal from the runners,
# 2026-09-16). Every job is read-only (contents: read). Nothing here pushes an
# image, opens a pull request, or has any credential or route to the home-lab
# cluster. Changes under .github/ need the label gate-change-reviewed
# (test/scripts/growth-gate.sh).
name: ci

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  # The reviewed, patched toolchain used for build, tests, race tests and the
  # vulnerability scan. go.mod keeps `go 1.25.0` as the minimum language
  # version and `toolchain go1.27.3` as the default toolchain; GOTOOLCHAIN=local
  # forbids the Go command from switching toolchains silently in CI, so the
  # scanned standard library is the one the binaries are built with.
  GO_VERSION: "1.27.3"
  GOTOOLCHAIN: local
  # Pinned versions of the tools that are installed from the Go module proxy
  # (checksums verified against sum.golang.org by the go command) rather than
  # downloaded as opaque binaries.
  KUSTOMIZE_VERSION: v5.8.1
  KIND_VERSION: v0.33.0
  ACTIONLINT_VERSION: v1.7.12
  # Pinned scanner and SBOM generator versions (installed by their pinned
  # actions; the versions are asserted and recorded in the summaries).
  TRIVY_VERSION: v0.76.1
  SYFT_VERSION: v1.55.0
  # kind node image matching the home-lab Kubernetes minor (1.36.4), by digest
  # from the kind v0.33.0 release notes.
  KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  # Reviewed digest of deploy/kustomize/tests/run.sh (safety-check.py S5). A
  # changed runner needs a review, the constant updated there, and this value
  # updated in the same gate-change-reviewed change; never recomputed to pass.
  APPROVED_RUN_SH_SHA256: 9de4f58606298cac2f21d5180c098e1374cb1693aaac0da0b77f34660f09e46a

defaults:
  run:
    shell: bash # bash -eo pipefail: a failing command in a pipeline fails the step

jobs:
  go:
    name: build, test, lint (fresh checkout)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the growth gate compares against the base revision
          persist-credentials: false

      - name: Entry points are tracked (CR-01 guard)
        run: |
          # Every command's main.go must be tracked (Phase 0 found go/cmd
          # ignored by a loose pattern). Test files may accompany them.
          for f in gb-client gb-server gbctl makeuniv racegen; do
            git ls-files --error-unmatch "go/cmd/$f/main.go" >/dev/null || { echo "go/cmd/$f/main.go is not tracked"; git ls-files go/cmd; exit 1; }
          done

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
          cache-dependency-path: go/go.sum

      - name: Toolchain is the pinned one
        working-directory: go
        run: |
          go version
          go version | grep -q "go${GO_VERSION} " || { echo "unexpected toolchain"; exit 1; }
          go env GOTOOLCHAIN

      - name: go build
        working-directory: go
        run: go build ./...

      - name: gofmt (strict)
        working-directory: go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet (strict)
        working-directory: go
        run: go vet ./...

      - name: go mod verify and tidy check
        working-directory: go
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Golden fixtures reproduce from the C reference
        working-directory: test/ctool
        run: make check

      - name: go test and inventory reconciliation (records of what actually executed)
        env:
          GB_TEST_SUMMARY: ${{ runner.temp }}/known-defects.txt
          GB_INVENTORY_RECORDS: ${{ runner.temp }}/inventory-records
        run: test/scripts/inventory-check.sh 2>&1 | tee "$RUNNER_TEMP/inventory.txt"

      - name: go test -race
        working-directory: go
        run: go test -count=1 -race ./...

      - name: Golden mutation self-checks (temporary copies)
        run: test/scripts/golden-mutations.sh

      - name: govulncheck (strict, same toolchain as the build)
        working-directory: go
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Lint gate (golangci-lint v2.15.0 report validated and compared with the baseline)
        run: test/scripts/lint-gate.sh "$RUNNER_TEMP/lint.json" 2>&1 | tee "$RUNNER_TEMP/lintdiff.txt"

      - name: Acknowledgment gate (pull requests only)
        env:
          # pull_request: the exact label names from the event payload as a JSON
          # array; labeled/unlabeled events re-run this workflow. push: the
          # script performs technical validation only (no label lookups, no API
          # calls). Commit messages and trailers are never consulted.
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_REV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: test/scripts/growth-gate.sh "$BASE_REV" 2>&1 | tee "$RUNNER_TEMP/growth.txt"

      - name: Known-defect and lint summary
        if: always()
        run: |
          {
            echo "## Known-defect inventory (golden tests)"
            echo '```'
            cat "$RUNNER_TEMP/known-defects.txt" 2>/dev/null || echo "(summary not produced: tests did not reach the golden suite)"
            echo '```'
            echo "## Lint gate"
            echo '```'
            cat "$RUNNER_TEMP/lintdiff.txt" 2>/dev/null || echo "(lint gate did not run)"
            echo '```'
            echo "## Inventory reconciliation"
            echo '```'
            grep -E '^inventorycheck:' "$RUNNER_TEMP/inventory.txt" 2>/dev/null || echo "(inventory reconciliation did not run)"
            echo '```'
            echo "## Growth and tooling review gate"
            echo '```'
            cat "$RUNNER_TEMP/growth.txt" 2>/dev/null || echo "(growth gate did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: docker build from checkout (no push)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the legacy root Dockerfile from tracked sources only (unchanged Phase 0 check)
        run: docker build --tag gb:ci .
