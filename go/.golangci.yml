# golangci-lint v2 configuration for the GB Go module (Phase 0).
#
# Strict gates (build, gofmt, go vet, tests) live in the CI workflow. This file
# configures the *baselined* linters: errcheck, staticcheck, gosec and govet.
# Their JSON report is compared with docs/testing/lint-baseline.txt by
# go/tools/lintdiff (test/scripts/lint-gate.sh); findings not in the baseline,
# and baseline entries that no longer occur, fail the build. The pre-existing
# findings are summarised in docs/testing/lint-baseline.md with the phase that
# removes them. Nothing here silences a rule globally. The `unused` linter is
# deliberately not enabled; the 13 U1000 findings reported by a direct
# staticcheck run are listed in docs/testing/phase0-baseline.md.
version: "2"
run:
  timeout: 10m
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - gosec
    - govet
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    gosec:
      excludes: []
  exclusions:
    generated: lax
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
