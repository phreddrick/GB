      "DualLogin": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "race": {
            "type": "string",
            "minLength": 1
          },
          "race_password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 72,
            "writeOnly": true,
            "description": "Nonempty UTF-8 credential, at most 72 bytes; no NUL or line endings. Operator provisioning requires 12..72 bytes and distinct race/governor secrets. Never place in a URL or log."
          },
          "governor": {
            "type": "integer",
            "minimum": 0,
            "maximum": 5
          },
          "governor_password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 72,
            "writeOnly": true,
            "description": "Nonempty UTF-8 credential, at most 72 bytes; no NUL or line endings. Operator provisioning requires 12..72 bytes and distinct race/governor secrets. Never place in a URL or log."
          }
        },
        "required": [
          "race",
          "race_password",
          "governor",
          "governor_password"
        ]
      },
      "LegacyLogin": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "race": {
            "type": "string",
            "minLength": 1
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "maxLength": 72,
            "writeOnly": true,
            "description": "Nonempty UTF-8 credential, at most 72 bytes; no NUL or line endings. Operator provisioning requires 12..72 bytes and distinct race/governor secrets. Never place in a URL or log."
          },
          "governor": {
            "type": "integer",
            "minimum": 0,
            "maximum": 5
          }
        },
        "required": [
          "race",
          "password",
          "governor"
        ]
      },
      "Login": {
        "oneOf": [
          {
            "$ref": "#/components/schemas/DualLogin"
          },
          {
            "$ref": "#/components/schemas/LegacyLogin"
          }
        ],
        "description": "Legacy accepted only for races without CR-07 placement history and safe existing governor credentials. New enrollments always require both independent checks. Mixing contracts is rejected. Errors do not reveal which credential failed."
      },
      "LoginToken": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "token": {
            "type": "string",
            "description": "Existing HS256 JWT with current credential/permission revision; revalidated on WebSocket admission and actor command admission. Never log."
          }
        },
        "required": [
          "token"
        ]
      }
    }
  }
