apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entry point of the Argo CD Application gb-dev-server (k8s-helpers:
# argocd/applications/gb-dev-server.yaml, path deploy/kustomize/apps/dev/server,
# targetRevision master). Manual sync only; synced after gb-dev-platform
# (docs/operations/deploy.md).

namespace: gb-dev

resources:
  - ../../../base/server

images:
  # Deployments reference a digest, never a tag (ADR-0006). The digest below
  # is the immutable manifest digest of the first image published in Phase 2C
  # by the manual publish-images.yml run 41266551465 (built from commit
  # 46b7bc0011df) and verified by digest against GHCR by that run, by the
  # digest-update-pr.yml run that proposed it (pull request #6, merged
  # 2026-11-01) and by the ci manifests job. It is only ever replaced by the
  # pull request that digest-update-pr.yml opens from a `published` record;
  # the validator rejects a tag, a malformed value and the all-zero
  # UNPUBLISHED sentinel in strict mode (deploy/kustomize/tests/run.sh
  # --require-published-image). Merging deploys nothing: synchronisation is a
  # separately approved manual step (docs/operations/deploy.md).
  - name: ghcr.io/phreddrick/gb-server
    digest: sha256:a2e433228760d9556e1824aad3fc4b09321a50d7dd8e225bf69e489a9432535a

configMapGenerator:
  - name: gb-engine-config
    behavior: merge
    literals:
      # Browser Origin seen through Traefik; required for WebSocket upgrades
      # (empty would mean same-origin only, which the pod's Host is not).
      - GB_WS_ALLOWED_ORIGINS=https://gb-dev.home.spukhaus.com

patches:
  - target:
      kind: Ingress
      name: gb-player
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: letsencrypt-production-cloudflare
          traefik.ingress.kubernetes.io/router.middlewares: gb-dev-https-redirect@kubernetescrd
      - op: replace
        path: /spec/tls/0/hosts/0
        value: gb-dev.home.spukhaus.com
      - op: replace
        path: /spec/tls/0/secretName
        value: gb-dev-tls
      - op: replace
        path: /spec/rules/0/host
        value: gb-dev.home.spukhaus.com
