apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
# CoreDNS pods on the home-lab cluster carry k8s-app=kube-dns in kube-system
# (verified 2026-10-30: rke2-coredns pods also carry
# app.kubernetes.io/name=rke2-coredns). kind's CoreDNS uses the same
# k8s-app=kube-dns label, so the ci entry point renders this unchanged.
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
