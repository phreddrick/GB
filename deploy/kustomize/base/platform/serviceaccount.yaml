apiVersion: v1
kind: ServiceAccount
metadata:
  name: gb-engine
  labels:
    app.kubernetes.io/name: gb-engine
    app.kubernetes.io/component: engine
# The server never calls the Kubernetes API: no Role, no RoleBinding, and no
# token is mounted (the StatefulSet also sets automountServiceAccountToken:
# false on the pod, so both sides agree).
automountServiceAccountToken: false
