apiVersion: v1
kind: Service
metadata:
  name: gb-player
  labels:
    app.kubernetes.io/name: gb-engine
    app.kubernetes.io/component: engine
# ClusterIP Service the Ingress routes to. Player listener only.
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gb-engine
    app.kubernetes.io/component: engine
  ports:
    - name: player
      port: 8080
      targetPort: player
      protocol: TCP
